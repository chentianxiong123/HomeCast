name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ── 后端：静态检查 + 单元测试（go/ 模块，纯 Go 无 GUI 依赖）──
  backend-test:
    name: 后端 vet + 单测
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: |
            go/go.sum
            wails3/go.sum
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  # ── Linux 桌面构建（wails3 壳，cgo + GTK3/WebKitGTK）──
  build-linux:
    name: 构建 Linux 桌面
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: |
            go/go.sum
            wails3/go.sum
      - name: 安装 GTK4 / WebKitGTK-6.0 / appindicator 依赖
        # wails v3.1.0 Linux 需 gtk4 + webkitgtk-6.0（不是旧的 webkit2gtk-4.1）
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libayatana-appindicator3-dev
      - name: wails3 模块 vet
        run: |
          cd wails3 && go vet ./...
      - name: 安装 wails3 CLI（与 go.mod 同版本）
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
      - name: 官方构建（Linux，gtk4 + go:embed）
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          cd wails3 && wails3 build && cp bin/hcexp ../mymusic-linux && chmod +x ../mymusic-linux && ls -lh ../mymusic-linux
      - uses: actions/upload-artifact@v4
        with:
          name: mymusic-linux
          path: mymusic-linux
          if-no-files-found: error

  # ── Linux 壳级 E2E 冒烟（Xvfb 启动真实 wails3 app：进程/后端/页面/API 最小链路）──
  shell-e2e:
    name: Linux 壳级 E2E 冒烟
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: |
            go/go.sum
            wails3/go.sum
      - name: 安装 GTK4 / WebKitGTK-6.0 / appindicator / Xvfb 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libayatana-appindicator3-dev xvfb curl
      - name: 下载 build-linux 产物
        uses: actions/download-artifact@v4
        with:
          name: mymusic-linux
          path: wails3/bin
      - name: 修复产物权限
        run: chmod +x wails3/bin/mymusic-linux
      - name: 壳级 E2E 冒烟（Xvfb 启动真实 app + 断言进程/后端/页面/API）
        run: |
          cp wails3/bin/mymusic-linux wails3/bin/hcexp
          bash scripts/shell-e2e.sh wails3/bin/hcexp

  # ── Windows 桌面构建（mingw 交叉编译，无需 Windows runner）──
  build-windows:
    name: 构建 Windows 桌面
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: |
            go/go.sum
            wails3/go.sum
      - name: 安装 mingw-w64 + GTK4/WebKitGTK-6.0（wails3 CLI 自身在 Linux 编译需 cgo 依赖）
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 libgtk-4-dev libwebkitgtk-6.0-dev libayatana-appindicator3-dev
      - name: 安装 wails3 CLI（与 go.mod 同版本）
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
      - name: 官方构建（Windows，mingw + CGO）
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          cd wails3 && wails3 build GOOS=windows && cp bin/hcexp.exe ../mymusic-windows.exe && chmod +x ../mymusic-windows.exe && ls -lh ../mymusic-windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: mymusic-windows
          path: mymusic-windows.exe
          if-no-files-found: error

  # ── 鸿蒙：轻量资产检查（GitHub runner 无 DevEco/HarmonyOS SDK/模拟器，无法跑真 HAP 构建；
  #    这里只守壳工程关键资产与历史根因修复，防回归；真机构建按 build-harmony.md 在本机跑）──
  harmony-checks:
    name: 鸿蒙壳资产检查（防回归）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 壳工程关键文件齐全
        run: |
          set -euo pipefail
          H=wails3/build/harmony
          for f in \
            $H/AppScope/app.json5 \
            $H/build-profile.json5 \
            $H/entry/build-profile.json5 \
            $H/entry/src/main/cpp/CMakeLists.txt \
            $H/entry/src/main/cpp/napi_init.cpp \
            $H/entry/src/main/cpp/types/libentry/Index.d.ts \
            $H/entry/src/main/ets/entryability/EntryAbility.ets \
            $H/entry/src/main/ets/pages/Index.ets \
            $H/entry/src/main/module.json5 \
            $H/entry/src/main/resources/base/profile/network_config.json; do
            test -f "$f" || { echo "MISSING: $f"; exit 1; }
          done
          echo "壳工程文件齐全"
      - name: 防回归：CMake 不带绝对路径（SKIP_RPATH + IMPORTED_NO_SONAME）
        run: |
          set -euo pipefail
          C=wails3/build/harmony/entry/src/main/cpp/CMakeLists.txt
          grep -q 'CMAKE_SKIP_RPATH' "$C" || { echo '缺 CMAKE_SKIP_RPATH'; exit 1; }
          grep -q 'IMPORTED_NO_SONAME' "$C" || { echo '缺 IMPORTED_NO_SONAME'; exit 1; }
          echo "CMake 防绝对路径两开关在位"
      - name: 防回归：NAPI 命名导出 / ArkTS 命名导入对齐
        run: |
          set -euo pipefail
          D=wails3/build/harmony/entry/src/main/cpp/types/libentry/Index.d.ts
          A=wails3/build/harmony/entry/src/main/ets/entryability/EntryAbility.ets
          grep -q 'export const startServer' "$D" || { echo 'Index.d.ts 须为命名导出'; exit 1; }
          grep -q "import { startServer } from 'libentry.so'" "$A" || { echo 'EntryAbility 须命名导入'; exit 1; }
          echo "NAPI 导出/导入对齐"
      - name: 防回归：INTERNET 权限 + 明文 HTTP 允许（127.0.0.1）
        run: |
          set -euo pipefail
          M=wails3/build/harmony/entry/src/main/module.json5
          N=wails3/build/harmony/entry/src/main/resources/base/profile/network_config.json
          grep -q 'ohos.permission.INTERNET' "$M" || { echo '缺 INTERNET 权限'; exit 1; }
          grep -q 'cleartextTrafficPermitted' "$N" || { echo '缺明文 HTTP 配置'; exit 1; }
          echo "网络权限齐备"
      - name: Go 鸿蒙入口存在且导出 StartServer
        run: |
          set -euo pipefail
          G=go/cmd/server/main_harmony.go
          test -f "$G" || { echo "MISSING: $G"; exit 1; }
          grep -q '//go:build openharmony' "$G" || { echo '缺 openharmony build tag'; exit 1; }
          grep -q '//export StartServer' "$G" || { echo '缺 StartServer 导出'; exit 1; }
          echo "Go 鸿蒙入口在位"
      - name: 构建文档为复现手册（含根因与步骤）
        run: |
          set -euo pipefail
          D=wails3/build-harmony.md
          for k in '复现步骤' 'CMakeLists' 'DT_NEEDED' 'sign-homecast' 'hvigorw'; do
            grep -q "$k" "$D" || { echo "build-harmony.md 缺关键词: $k"; exit 1; }
          done
          echo "复现手册完整"

  # ── 安卓 Java 编译 + 出 debug 签名 APK（jniLibs 已预置 libwails.so，无需交叉编 Go）──
  build-android:
    name: 构建安卓 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 安装 Android SDK 组件（runner 预装 SDK；setup-android@v3 依赖的 `tools` 包已被 Google 下架）
        run: |
          set -euo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKM" || SDKM="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-35" "build-tools;35.0.0" | tail -3
      - name: 缓存 Gradle（runner 拉 wrapper 分发容易超时，缓存后不重复下）
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false
      - name: 安卓 Java 编译 + assembleRelease（LyricOverlayService/MainActivity 等）
        run: |
          cd wails3/build/android
          ./gradlew :app:assembleRelease --no-daemon
      - name: 收集 APK（无 keystore 时 gradle 自动走 debug 签名，可装测试）
        run: |
          set -euo pipefail
          APK="$(find wails3/build/android/app/build/outputs/apk/release -name '*.apk' | head -1)"
          test -n "$APK" || { echo '未找到 APK'; exit 1; }
          cp "$APK" mymusic-android-arm64.apk
          ls -lh mymusic-android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mymusic-android
          path: mymusic-android-arm64.apk
          if-no-files-found: error

  # ── macOS 桌面构建（macos runner + Xcode；cgo + Cocoa/WebKit）──
  build-macos:
    name: 构建 macOS 桌面
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: |
            go/go.sum
            wails3/go.sum
      - name: 安装 wails3 CLI（与 go.mod 同版本）
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
      - name: 官方构建（macOS，Cocoa + WebKit，原生架构）
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          cd wails3 && wails3 build
      - name: 打包 macOS 产物
        run: |
          set -euo pipefail
          cd wails3/bin
          if [ -d hcexp.app ]; then zip -qr ../../mymusic-macos.app.zip hcexp.app; else cp hcexp ../../mymusic-macos; fi
          ls -lh ../..
      - uses: actions/upload-artifact@v4
        with:
          name: mymusic-macos
          path: mymusic-macos*
          if-no-files-found: error

  # ── 发行：打 tag 时聚合各端产物发 GitHub Release（不较真验证，出包即发）──
  release:
    name: 发行 Release（聚合各端包）
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos, build-ios, build-android]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 整理产物名（各 job 已命名，这里只列清单）
        run: |
          set -euo pipefail
          ls -lh dist
          echo '=== 待发产物 ===' && ls -lh dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: false
          generate_release_notes: true

  # ── iOS 模拟器构建（macos runner + Xcode；架构自适应 + 模拟器 ad-hoc 签名）──
  build-ios:
    name: 构建 iOS 模拟器
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: |
            go/go.sum
            wails3/go.sum
      - name: 安装 wails3 CLI（与 go.mod 同版本）
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
      - name: iOS 模拟器构建 + 打包（架构自适应，ad-hoc 签名，无需真机签名）
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          cd wails3 && wails3 task ios:package
      - name: 打包 iOS 模拟器 .app（zip 避免目录被打散）
        run: |
          set -euo pipefail
          cd wails3/bin
          test -d hcexp.app || { echo '未产出 hcexp.app'; ls -R .; exit 1; }
          zip -qr ../../mymusic-ios-simulator.app.zip hcexp.app
          ls -lh ../..
      - uses: actions/upload-artifact@v4
        with:
          name: mymusic-ios
          path: mymusic-ios-simulator.app.zip
          if-no-files-found: error
