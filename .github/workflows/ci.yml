name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ── 后端：静态检查 + 单元测试（go/ 模块，纯 Go 无 GUI 依赖）──
  backend-test:
    name: 后端 vet + 单测
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: |
            go/go.sum
            wails3/go.sum
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  # ── Linux 桌面构建（wails3 壳，cgo + GTK3/WebKitGTK）──
  build-linux:
    name: 构建 Linux 桌面
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: |
            go/go.sum
            wails3/go.sum
      - name: 安装 GTK4 / WebKitGTK / appindicator 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
      - name: wails3 模块 vet
        run: |
          cd wails3 && go vet ./...
      - name: 安装 wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.25
      - name: 官方构建（Linux，gtk4 + go:embed）
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          cd wails3 && wails3 build
      - uses: actions/upload-artifact@v4
        with:
          name: hcexp-linux
          path: wails3/bin/hcexp
          if-no-files-found: error

  # ── Windows 桌面构建（mingw 交叉编译，无需 Windows runner）──
  build-windows:
    name: 构建 Windows 桌面
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: |
            go/go.sum
            wails3/go.sum
      - name: 安装 mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: 安装 wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.25
      - name: 官方构建（Windows，mingw + CGO）
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          cd wails3 && wails3 build GOOS=windows
      - uses: actions/upload-artifact@v4
        with:
          name: hcexp-win
          path: wails3/bin/hcexp.exe
          if-no-files-found: error

  # ── 安卓 Java 编译检查（防 Java 回归；Go .so 预编译进 jniLibs，Java 独立）──
  build-android:
    name: 安卓 Java 编译检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: 安卓 Java 编译（LyricOverlayService/MainActivity 等）
        run: |
          cd wails3/build/android
          ./gradlew :app:compileReleaseJavaWithJavac --no-daemon

  # ── macOS 桌面构建（macos runner + Xcode；cgo + Cocoa/WebKit）──
  build-macos:
    name: 构建 macOS 桌面
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: |
            go/go.sum
            wails3/go.sum
      - name: 安装 wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.25
      - name: 官方构建（macOS，Cocoa + WebKit，原生架构）
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          cd wails3 && wails3 build
      - uses: actions/upload-artifact@v4
        with:
          name: hcexp-macos
          path: wails3/bin/hcexp
          if-no-files-found: error

  # ── iOS 模拟器构建（macos runner + Xcode；架构自适应 + 模拟器 ad-hoc 签名）──
  build-ios:
    name: 构建 iOS 模拟器
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: |
            go/go.sum
            wails3/go.sum
      - name: 安装 wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.25
      - name: iOS 模拟器构建 + 打包（架构自适应，ad-hoc 签名，无需真机签名）
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          cd wails3 && wails3 task ios:package
      - uses: actions/upload-artifact@v4
        with:
          name: hcexp-ios
          path: wails3/bin/hcexp.app
          if-no-files-found: error
