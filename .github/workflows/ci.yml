name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ── 后端：静态检查 + 单元测试（go/ 模块，纯 Go 无 GUI 依赖）──
  backend-test:
    name: 后端 vet + 单测
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: |
            go/go.sum
            wails3/go.sum
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  # ── Linux 桌面构建（wails3 壳，cgo + GTK3/WebKitGTK）──
  build-linux:
    name: 构建 Linux 桌面
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: |
            go/go.sum
            wails3/go.sum
      - name: 安装 GTK3 / WebKitGTK / appindicator 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libgtk-4-dev libwebkit2gtk-6.0-dev
      - name: wails3 模块 vet
        run: |
          cd wails3 && go vet -tags gtk3 ./...
      - name: 安装 wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.25
      - name: 官方构建（Linux，gtk3 + go:embed）
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          cd wails3 && wails3 build -tags gtk3
      - uses: actions/upload-artifact@v4
        with:
          name: hcexp-linux
          path: wails3/bin/hcexp
          if-no-files-found: error

  # ── Windows 桌面构建（mingw 交叉编译，无需 Windows runner）──
  build-windows:
    name: 构建 Windows 桌面
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: |
            go/go.sum
            wails3/go.sum
      - name: 安装 mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 libgtk-4-dev libwebkit2gtk-6.0-dev
      - name: 安装 wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.25
      - name: 官方构建（Windows，mingw + CGO）
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          cd wails3 && wails3 build GOOS=windows
      - uses: actions/upload-artifact@v4
        with:
          name: hcexp-win
          path: wails3/bin/hcexp.exe
          if-no-files-found: error
