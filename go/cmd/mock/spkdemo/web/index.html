<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>spkdemo · mock 控制台</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: ui-monospace, monospace; background: #111; color: #ddd; margin: 0; padding: 24px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: #888; font-size: 12px; margin-bottom: 16px; }
  .card { background: #1b1b1b; border: 1px solid #333; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .btn { background: #2a2a2a; border: 1px solid #444; color: #ddd; border-radius: 6px;
         padding: 8px 16px; cursor: pointer; font-size: 14px; }
  .btn:hover { background: #3a3a3a; }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn-primary { background: #1e5aa8; border-color: #2a6ec0; }
  .song { flex:1; text-align: left; }
  .song.active { background: #1e5aa8; border-color: #4a90e2; }
  input[type=range] { width: 100%; }
  .stat { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; font-size: 13px; }
  .stat b { color: #7adb7a; }
  .ok { color: #7adb7a; }
  .bad { color: #ff6b6b; font-weight: bold; }
  .log { background: #0d0d0d; border: 1px solid #333; border-radius: 6px; padding: 8px;
         height: 160px; overflow-y: auto; font-size: 12px; white-space: pre-wrap; }
  .log .t { color: #888; }
  #posLabel { font-size: 20px; font-variant-numeric: tabular-nums; }
  small { color: #888; }
  code { background:#222; padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
<h1>🎛 spkdemo · 独立 mock 控制台</h1>
<div class="sub">自己 serve 音频 + 支持 seek/暂停/继续；真音箱可经 /stream 拉流（Range 断点续传）</div>

<div class="card">
  <div style="font-size:13px; margin-bottom:8px">音箱拉流地址（投给小爱用，换成你机器局域网 IP）：</div>
  <div style="font-size:13px" id="streamUrl"><code>http://<你的IP>:29111/stream</code></div>
</div>

<div class="card">
  <div class="row" style="margin-bottom:4px">
    <button class="btn btn-primary" id="playBtn">▶ 播放</button>
    <button class="btn" id="pauseBtn">⏸ 暂停（喂静音）</button>
    <button class="btn" id="resumeBtn">⏯ 继续</button>
    <button class="btn" id="nextBtn">⏭ 下一首</button>
    <button class="btn" id="prevBtn">⏮ 上一首</button>
    <span class="flex:1" style="flex:1"></span>
    <span id="posLabel">0.0s / 0s</span>
  </div>
  <div class="row">
    <span style="font-size:13px">seek（拖动）：</span>
    <input type="range" id="seekBar" min="0" max="120" step="0.1" value="0" style="flex:1">
  </div>
</div>

<div class="card">
  <div class="stat">
    <span>当前源</span><b id="srcTitle">—</b>
    <span>播放状态</span><b id="playing">—</b>
    <span>进度</span><b id="pos">0.0s</b>
    <span>最近操作</span><b id="lastOp">—</b>
    <span>操作→音箱拉流延迟</span><b id="lastLat">—</b>
    <span>连接次数</span><b id="connCount">0</b>
  </div>
</div>

<div class="card">
  <div style="font-size:13px; margin-bottom:8px">📋 延迟时间线 <span id="summary"></span></div>
  <div class="log" id="log"></div>
</div>

<script>
const $ = id => document.getElementById(id);
let lastOp = '', latOk = 0, latBad = 0;

function log(msg, cls='') {
  const d = $('log');
  const line = document.createElement('div');
  line.innerHTML = `<span class="t">[${new Date().toLocaleTimeString()}]</span> ${msg}`;
  d.prepend(line);
  while (d.children.length > 50) d.removeChild(d.lastChild);
  $('summary').innerHTML = `<span class="ok">≤2s ×${latOk}</span> <span class="bad">&gt;2s ×${latBad}</span>`;
}

async function ctl(op, extra={}) {
  try {
    const r = await fetch('/api/control', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ op, ...extra }) });
    if (!r.ok) throw new Error('HTTP '+r.status);
    log(`操作 <b>${op}</b>${extra.sec !== undefined ? ' '+extra.sec+'s' : ''} 已提交`);
  } catch(e) { log(`操作 ${op} 失败: ${e}`); }
}

async function poll() {
  try {
    const s = await (await fetch('/api/state')).json();
    $('srcTitle').textContent = s.title;
    $('playing').textContent = s.playing ? '▶ 播放中' : '⏸ 已暂停（喂静音，流不断）';
    $('pos').textContent = s.pos + 's';
    $('posLabel').textContent = `${s.pos}s / ${s.dur}s`;
    $('lastOp').textContent = s.lastOp || '—';
    $('connCount').textContent = s.connCount;
    const lat = s.lastLatMs;
    if (lat !== undefined && lat >= 0) {
      const ok = lat <= 2000;
      $('lastLat').innerHTML = `<span class="${ok?'ok':'bad'}">${lat} ms</span>`;
      if (s.lastOp && s.lastOp !== lastOp) {
        lastOp = s.lastOp;
        log(`${ok?'✅':'❌'} 延迟 <span class="${ok?'ok':'bad'}">${lat} ms</span>（${s.lastOp}）`);
        ok ? latOk++ : latBad++;
      }
    }
    if (!dragActive) $('seekBar').value = Math.min(parseFloat($('seekBar').max), s.pos);
  } catch(e) { /* mock 未启动 */ }
}

let dragActive = false;
$('seekBar').addEventListener('pointerdown', ()=>{ dragActive = true; });
$('seekBar').addEventListener('change', ()=>{ dragActive = false; ctl('seek', {sec: parseFloat($('seekBar').value)}); });
$('playBtn').onclick = ()=>ctl('play');
$('pauseBtn').onclick = ()=>ctl('pause');
$('resumeBtn').onclick = ()=>ctl('resume');
$('nextBtn').onclick = ()=>ctl('next');
$('prevBtn').onclick = ()=>ctl('prev');

log('mock 已连接。');
setInterval(poll, 500);
</script>
</body>
</html>
