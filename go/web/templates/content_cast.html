{{/* 投屏页（对照 Vue 版 CastView：设备列表 + 重新扫描 + 投送） */}}
<div class="mb-8">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h2 class="text-xl font-bold text-gray-900 dark:text-white">投屏</h2>
      <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">发现局域网设备，把当前播放投送到电视 / 音箱</p>
    </div>
    <button hx-post="/hx/cast/rescan" hx-target="#cast-list" hx-swap="innerHTML"
            class="flex items-center space-x-2 px-6 py-2.5 bg-gradient-to-r from-pink-500 to-violet-500 text-white font-medium rounded-full shadow-md hover:brightness-105 transition-all">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      <span>重新扫描</span>
    </button>
  </div>
  <div id="cast-list">
    {{template "cast_devices.html" .}}
  </div>

  <!-- 音箱区（M4b：扫码登录/设备/控制；登录态由服务端判定） -->
  <div class="mt-12 border-t border-gray-200 dark:border-gray-700 pt-8">
    <div id="speaker-section" hx-get="/hx/speaker" hx-trigger="load" hx-swap="innerHTML"></div>
  </div>
</div>
