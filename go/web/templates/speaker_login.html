{{/* 音箱区 · 未登录：扫码入口（登录成功 → #speaker-section 被面板替换） */}}
<div class="text-center py-12">
  <div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-br from-blue-500 to-violet-500 flex items-center justify-center shadow-lg mb-4">
    <svg class="w-7 h-7 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M5 5.5A9 9 0 0 1 19 5.5M8 9a5 5 0 0 1 8 0"/><path d="M3 14a12 12 0 0 1 18 0"/></svg>
  </div>
  <p class="text-lg font-semibold text-gray-900 dark:text-white">小爱音箱</p>
  <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">扫码登录米家账号，投送到音箱播放</p>
  <div id="sp-qr-box" class="mt-5">
    <button hx-post="/hx/speaker/qr-start" hx-target="#sp-qr-box" hx-swap="innerHTML"
            class="px-8 py-2.5 bg-gradient-to-r from-pink-500 to-violet-500 text-white font-medium rounded-full shadow-md hover:brightness-105 transition-all">
      扫码登录
    </button>
  </div>

  <details class="mt-6 text-left max-w-md mx-auto text-xs text-gray-400">
    <summary class="cursor-pointer hover:text-pink-400 inline-flex items-center space-x-1">
      <span>已有 token？粘贴复用登录（多端共用一个账号）</span>
    </summary>
    <div class="mt-3 flex flex-col space-y-2">
      <textarea id="sp-token-input" rows="4" placeholder="粘贴其他端导出的 token JSON（音箱面板→导出 token）"
        class="bg-gray-100 dark:bg-gray-800 rounded-lg p-2 font-mono text-[10px] border border-gray-200 dark:border-gray-700 leading-relaxed"></textarea>
      <button onclick="hcSpeakerImport()" class="px-4 py-2 bg-gray-800 dark:bg-gray-700 text-white rounded-full text-xs hover:brightness-110">导入登录</button>
      <p class="text-gray-400">安卓端：token 也可直接拷到 filesDir/.config/homecast/speaker.json</p>
    </div>
  </details>
</div>
<script>
function hcSpeakerImport() {
  var tok = document.getElementById('sp-token-input').value.trim();
  if (!tok) return;
  fetch('/api/v1/speaker/token/import', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({token: tok})})
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d.code === 0) { htmx.ajax('GET','/hx/speaker',{target:'#speaker-section',swap:'innerHTML'}); }
      else alert('导入失败: ' + (d.message || '未知错误'));
    });
}
</script>
