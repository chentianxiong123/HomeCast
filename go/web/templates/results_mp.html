{{/* 小程序搜索结果片段：纯展示 + <a href="hc-play://...">，供 mp-html 渲原生并触发 link 事件 */}}
{{if not .Items}}
<div style="padding:48px 16px;text-align:center;color:#999;font-size:14px">未找到相关音乐</div>
{{else}}
<div>
  <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0 12px">
    <div style="font-size:15px;font-weight:600;color:#333">搜索结果</div>
    <div style="font-size:13px;color:#999">已找到 {{.Total}} 首</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:10px">
    {{range .Items}}
    <a href="https://play.homecast/?bvid={{.BVID}}"
       style="display:flex;align-items:center;gap:10px;padding:10px;background:#fff;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.06);text-decoration:none">
      <img src="{{coverURL .Cover}}" style="width:64px;height:48px;object-fit:cover;border-radius:10px;flex-shrink:0" referrerpolicy="no-referrer" />
      <div style="flex:1;min-width:0">
        <div style="font-size:14px;font-weight:600;color:#333;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{shortTitle .Title}}</div>
        <div style="font-size:12px;color:#999;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{.Artist}} · {{.Duration}}</div>
      </div>
      <span style="width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#ec4899,#8b5cf6);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0">▶</span>
    </a>
    {{end}}
  </div>
</div>
{{end}}
