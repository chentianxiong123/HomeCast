{{/* 音箱设备列表（面板已登录后渲染；网格卡片，每卡可投送当前歌/暂停恢复） */}}
{{if not .Devices}}
<p class="text-sm text-gray-500 dark:text-gray-400 py-6 text-center">未发现音箱设备，点「刷新设备」重试</p>
{{else}}
<div class="grid gap-3 sm:grid-cols-2">
{{range .Devices}}
  <div class="p-4 bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 min-w-0">
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-3 min-w-0">
        <div class="w-10 h-10 rounded-xl bg-gray-100 dark:bg-gray-700 flex items-center justify-center flex-shrink-0">
          <svg class="w-5 h-5 text-gray-500 dark:text-gray-300" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-10 10h2a8 8 0 0 1 8-8z"/><path d="M12 6a6 6 0 0 0-6 6h2a4 4 0 0 1 4-4z"/><rect x="2" y="16" width="20" height="4" rx="1"/></svg>
        </div>
        <div class="min-w-0">
          <p class="font-medium text-gray-900 dark:text-white truncate">{{.Name}}</p>
          <p class="text-xs text-gray-500 dark:text-gray-400 truncate">{{.Hardware}}</p>
        </div>
      </div>
      <span class="inline-flex items-center text-[10px] text-green-600 dark:text-green-400 flex-shrink-0 ml-2">
        <span class="w-1.5 h-1.5 rounded-full bg-green-500 mr-1"></span>在线
      </span>
    </div>
    <div class="mt-3 flex items-center space-x-2">
      <button class="sp-play-btn px-3 py-1.5 bg-gradient-to-r from-pink-500 to-violet-500 text-white rounded-full text-xs hover:brightness-110 flex items-center space-x-1"
              data-did="{{.DID}}"
              onclick="hcBus.emit('speaker-play',{did:this.dataset.did})">
        <svg class="w-3 h-3" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <span>投送当前歌</span>
      </button>
      <button hx-post="/hx/speaker/control" hx-vals='{"did":"{{.DID}}","action":"pause"}'
              class="px-3 py-1.5 bg-gray-800 dark:bg-gray-700 text-white rounded-full text-xs hover:brightness-110">暂停</button>
      <button hx-post="/hx/speaker/control" hx-vals='{"did":"{{.DID}}","action":"play"}'
              class="px-3 py-1.5 bg-gray-800 dark:bg-gray-700 text-white rounded-full text-xs hover:brightness-110">恢复</button>
    </div>
    {{/* 本地模拟进度（speaker.js 轮询 /api/v1/speaker/progress/{did}，不打小米云） */}}
    <div class="sp-prog mt-3 hidden" data-did="{{.DID}}">
      <div class="h-1 bg-gray-200 dark:bg-gray-700 rounded-full overflow-hidden">
        <div class="sp-prog-fill h-full bg-gradient-to-r from-pink-500 to-violet-500 rounded-full" style="width:0%"></div>
      </div>
      <div class="mt-1 flex items-center justify-between text-[11px] text-gray-400">
        <span class="sp-prog-time">--:--</span>
        <span class="sp-prog-state font-medium"></span>
      </div>
    </div>
  </div>
{{end}}
</div>
{{end}}
