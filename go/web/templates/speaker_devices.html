{{if not .Devices}}
<p class="text-sm text-gray-500 dark:text-gray-400 py-6 text-center">未发现音箱设备，点刷新设备</p>
{{else}}
<div class="grid gap-3 sm:grid-cols-2">{{range .Devices}}
      <div class="p-4 bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 min-w-0">
        <div class="flex items-center justify-between">
          <div class="flex items-center space-x-3 min-w-0">
            <div class="w-10 h-10 rounded-xl bg-gray-100 dark:bg-gray-700 flex items-center justify-center flex-shrink-0">
              <svg class="w-5 h-5 text-gray-500 dark:text-gray-300" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-10 10h2a8 8 0 0 1 8-8z"/><path d="M12 6a6 6 0 0 0-6 6h2a4 4 0 0 1 4-4z"/><rect x="2" y="16" width="20" height="4" rx="1"/></svg>
            </div>
            <div class="min-w-0">
              <p class="font-medium text-gray-900 dark:text-white truncate">{{.Name}}</p>
              <p class="text-xs text-gray-500 dark:text-gray-400 truncate">{{.Hardware}}</p>
            
</div>
{{end}}
</div>
{{end}}
