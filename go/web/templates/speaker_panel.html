{{/* 音箱区 · 已登录面板：账户头 + 设备列表 + token 工具区 */}}
<div>
  <!-- 账户头：图标 + 标题 + 登录态徽标（userId 仅作提示，不裸甩在标题旁） -->
  <div class="flex items-center justify-between mb-4">
    <div class="flex items-center space-x-2.5">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-blue-500 to-violet-500 flex items-center justify-center">
        <svg class="w-4.5 h-4.5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M5 5.5A9 9 0 0 1 19 5.5M8 9a5 5 0 0 1 8 0"/><path d="M3 14a12 12 0 0 1 18 0"/></svg>
      </div>
      <div class="min-w-0">
        <h3 class="text-lg font-semibold text-gray-900 dark:text-white leading-tight">小爱音箱</h3>
        <span class="inline-flex items-center text-xs text-green-600 dark:text-green-400" title="米家账号 ID: {{.UserID}}">
          <span class="w-1.5 h-1.5 rounded-full bg-green-500 mr-1.5"></span>
          已登录
        </span>
      </div>
    </div>
    <button hx-post="/hx/speaker/refresh" hx-target="#sp-devices" hx-swap="innerHTML"
            class="text-xs px-3 py-1.5 rounded-full border border-gray-200 dark:border-gray-600 text-gray-500 dark:text-gray-400 hover:text-pink-400 hover:border-pink-400 transition-colors flex items-center space-x-1">
      <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      <span>刷新设备</span>
    </button>
  </div>

  <!-- 设备列表 -->
  <div id="sp-devices">
    {{template "speaker_devices.html" .}}
  </div>

  <!-- 多端 token 复用工具 -->
  <details class="mt-4 text-left text-xs text-gray-400">
    <summary class="cursor-pointer hover:text-pink-400 inline-flex items-center space-x-1.5">
      <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <span>多端免扫码：导出 token 给其他设备</span>
    </summary>
    <div class="mt-2.5 bg-gray-50 dark:bg-gray-800/60 rounded-xl p-3 flex flex-wrap items-center gap-2 justify-between">
      <span class="text-gray-400">复制后在另一台设备的音箱面板「已有 token？粘贴复用登录」导入，同一账号免重复扫码</span>
      <button onclick="hcSpeakerExport()" class="px-3 py-1.5 bg-gray-800 dark:bg-gray-700 text-white rounded-full text-xs hover:brightness-110 whitespace-nowrap">复制 token</button>
    </div>
  </details>
</div>
<script>
function hcSpeakerExport() {
  fetch('/api/v1/speaker/token/export')
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d.code === 0 && d.data && d.data.token) {
        navigator.clipboard.writeText(d.data.token).then(function(){ alert('token 已复制，去其他设备粘贴导入'); });
      } else alert('导出失败: ' + (d.message || '未登录'));
    });
}
</script>
