<!DOCTYPE html>
<html lang="zh-CN" class="sl-theme-dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>哔哩音乐</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.19.1/cdn/themes/dark.css">
  <link rel="stylesheet" href="/assets/style.css">
  <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.19.1/cdn/shoelace.js"></script>
  <script src="/assets/htmx.min.js"></script>
</head>
<body>
  <!-- 顶部导航 -->
  <header class="navbar">
    <div class="navbar-start">
      <a href="/" class="brand-link">
        <div class="logo w-9 h-9">♪</div>
        <span class="brand-name">哔哩音乐</span>
      </a>
    </div>
    <div class="navbar-center max-w-xl">
      <form hx-get="/hx/search" hx-target="#results" hx-swap="innerHTML" hx-push-url="true"
            class="search-form w-full">
        <sl-input name="kw" placeholder="搜索你喜欢的音乐..." clearable class="sl-input-wide"
                  hx-get="/hx/search" hx-target="#results" hx-swap="innerHTML" hx-push-url="true"
                  hx-trigger="sl-input changed delay:600ms" hx-params="kw"></sl-input>
        <sl-button type="submit" variant="primary" class="search-btn">
          <sl-icon slot="prefix" name="search"></sl-icon>搜索
        </sl-button>
      </form>
    </div>
    <div class="navbar-end">
      <a href="/hx/favs" hx-boost="true"><sl-button size="small" fill="clear">收藏</sl-button></a>
      <a href="/hx/playlist" hx-boost="true"><sl-button size="small" fill="clear">列表</sl-button></a>
      <a href="/hx/cast" hx-boost="true"><sl-button size="small" fill="clear">投屏</sl-button></a>
    </div>
  </header>

  <!-- 内容 -->
  <main class="page max-w-5xl mx-auto p-4 pb-40">
    <div id="results">
      <!-- 空态（htmx 搜索结果替换这里） -->
      <div class="hero">
        <div class="w-20 h-20 logo">♪</div>
        <h1 class="hero-title">哔哩音乐</h1>
        <p class="muted hero-sub">搜索、收藏、播放你的音乐<br>局域网一键投屏到电视与音箱</p>
      </div>
    </div>
  </main>

  <!-- 播放器孤岛（M1 接管） -->
  <div id="player-dock">
    <audio id="audio" preload="auto"></audio>
  </div>
</body>
</html>
