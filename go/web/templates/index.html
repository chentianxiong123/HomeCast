<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>哔哩音乐</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body class="min-h-screen">
  <!-- 顶部导航 -->
  <header class="navbar shadow-sm">
    <div class="navbar-start">
      <a href="/" class="flex items-center gap-2">
        <div class="w-9 h-9 logo">♪</div>
        <span class="text-lg font-bold tracking-wide">哔哩音乐</span>
      </a>
    </div>
    <div class="navbar-center flex-1 max-w-xl">
      <form hx-get="/hx/search" hx-target="#results" hx-swap="innerHTML" hx-push-url="true"
            class="flex items-center gap-2 w-full">
        <input type="text" name="kw" placeholder="搜索你喜欢的音乐..." autofocus
               class="input input-bordered flex-1"
               hx-get="/hx/search" hx-target="#results" hx-swap="innerHTML" hx-push-url="true"
               hx-trigger="keyup[!event.isComposing] changed delay:600ms" hx-params="kw">
        <button type="submit" class="btn btn-primary gap-1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          搜索
        </button>
      </form>
    </div>
    <div class="navbar-end gap-1">
      <a href="/hx/favs" class="btn btn-ghost btn-sm" hx-boost="true" title="M2 上线">收藏</a>
      <a href="/hx/playlist" class="btn btn-ghost btn-sm" hx-boost="true" title="M2 上线">列表</a>
      <a href="/hx/cast" class="btn btn-ghost btn-sm" hx-boost="true" title="M4 上线">投屏</a>
    </div>
  </header>

  <!-- 内容 -->
  <main class="max-w-5xl mx-auto p-4 pb-40">
    <div id="results">
      <!-- 空态：引导搜索 -->
      <div class="hero mt-16">
        <div class="hero-content text-center flex-col">
          <div class="w-20 h-20 logo mb-4">♪</div>
          <h1 class="text-3xl font-bold mb-2">哔哩音乐</h1>
          <p class="muted max-w-md">搜索、收藏、播放你的音乐<br>局域网一键投屏到电视与音箱</p>
          <div class="badge badge-outline badge-lg mt-6">Go 全内嵌 · htmx · 单二进制</div>
        </div>
      </div>
    </div>
  </main>

  <!-- 播放器孤岛（M1 接管） -->
  <div id="player-dock">
    <audio id="audio" preload="auto"></audio>
  </div>

  <script src="/assets/htmx.min.js"></script>
  <script src="/assets/alpine.min.js" defer></script>
</body>
</html>
