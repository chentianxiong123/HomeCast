{{/* 搜索结果片段：htmx 替换 #results */}}
{{if not .Items}}
<sl-card class="empty-card">
  <div class="empty-body items-center py-12 muted">
    <sl-icon name="music-note" class="empty-icon"></sl-icon>
    <p class="text-lg">未找到相关音乐</p>
    <p class="text-sm">换个关键词试试</p>
  </div>
</sl-card>
{{else}}
<div class="result-head flex items-center justify-between mb-3 px-1">
  <h2 class="result-title text-lg font-bold">搜索结果</h2>
  <sl-badge variant="neutral" pill>共 {{.Total}} 首 · 第 {{.Page}} 页</sl-badge>
</div>
<div class="space-y-2">
  {{range .Items}}
  <sl-card class="song-card">
    <div class="song-row flex items-center gap-3">
      <img src="{{coverURL .Cover}}" alt="{{.Title}}" loading="lazy" class="song-cover" referrerpolicy="no-referrer">
      <div class="flex-1 min-w-0">
        <div class="song-title font-medium truncate">{{.Title}}</div>
        <div class="song-meta text-sm muted flex items-center gap-2 mt-0.5">
          <span class="truncate max-w-[180px]">{{.Artist}}</span>
          <sl-badge size="small" pill>{{.Duration}}</sl-badge>
        </div>
      </div>
      <div class="song-actions flex items-center gap-1">
        <sl-button variant="primary" circle class="hx-play" data-bvid="{{.BVID}}" title="播放">
          <sl-icon name="play-fill"></sl-icon>
        </sl-button>
        <sl-button circle fill="clear" class="hx-fav" data-bvid="{{.BVID}}" title="收藏">
          <sl-icon name="star"></sl-icon>
        </sl-button>
        <sl-button circle fill="clear" class="hx-addpl" data-bvid="{{.BVID}}" title="加入列表">
          <sl-icon name="plus-lg"></sl-icon>
        </sl-button>
      </div>
    </div>
  </sl-card>
  {{end}}
</div>
{{if .HasMore}}
<div class="flex justify-center mt-4">
  <sl-button outline size="small"
             hx-get="/hx/search?kw={{.Keyword}}&page={{.NextPage}}"
             hx-target="#results" hx-swap="innerHTML">加载更多</sl-button>
</div>
{{end}}
{{end}}
