{{/* 搜索结果片段（照抄 Vue 版 SearchView 卡片结构） */}}
{{if not .Items}}
<div class="text-center py-20 text-gray-500 dark:text-gray-400">
  <svg class="w-16 h-16 mx-auto mb-4 text-gray-300 dark:text-gray-600" viewBox="0 0 24 24" fill="currentColor"><path d="M9 18V6H7v12h2zm8-12v12h2V6h-2z"/></svg>
  <p class="text-lg font-medium">未找到相关音乐</p>
  <p class="text-sm">换个关键词试试</p>
</div>
{{else}}
<div class="space-y-6">
  <div class="flex items-center justify-between">
    <h2 class="text-lg font-semibold text-gray-900 dark:text-white">搜索结果</h2>
    <span class="text-sm text-gray-500 dark:text-gray-400">共 {{.Total}} 首 · 第 {{.Page}} 页</span>
  </div>

  <div class="grid gap-3">
    {{range .Items}}
    <div class="group flex items-center space-x-4 p-4 bg-white dark:bg-gray-800 rounded-2xl shadow-sm hover:shadow-md transition-all duration-200 border border-gray-100 dark:border-gray-700">
      <!-- 封面 + hover 播放 -->
      <div class="relative flex-shrink-0">
        <img src="{{coverURL .Cover}}" alt="{{.Title}}" loading="lazy" referrerpolicy="no-referrer"
             class="w-20 h-14 sm:w-24 sm:h-16 object-cover rounded-xl shadow-sm">
        <button class="hx-play absolute inset-0 bg-black/30 rounded-xl opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center cursor-pointer"
                data-bvid="{{.BVID}}" data-title="{{.Title}}" data-artist="{{.Artist}}" data-cover="{{coverURL .Cover}}"
                onclick="hcBus.emit('play', {bvid:this.dataset.bvid, title:this.dataset.title, artist:this.dataset.artist, cover:this.dataset.cover})" title="播放">
          <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
      </div>

      <!-- 信息 -->
      <div class="flex-1 min-w-0">
        <h3 class="text-base sm:text-lg font-semibold text-gray-900 dark:text-white truncate">{{.Title}}</h3>
        <div class="flex items-center space-x-3 mt-1 text-sm text-gray-500 dark:text-gray-400">
          <span class="truncate max-w-[120px]">{{.Artist}}</span>
          <span>{{.Duration}}</span>
        </div>
      </div>

      <!-- 操作按钮（照抄 Vue 版） -->
      <div class="flex items-center space-x-2 flex-shrink-0">
        <button class="hx-play flex items-center space-x-1 px-4 py-1.5 rounded-full bg-gradient-to-r from-pink-500 to-violet-500 text-white text-sm font-medium shadow-sm hover:brightness-105 transition-all"
                data-bvid="{{.BVID}}" data-title="{{.Title}}" data-artist="{{.Artist}}" data-cover="{{coverURL .Cover}}"
                onclick="hcBus.emit('play', {bvid:this.dataset.bvid, title:this.dataset.title, artist:this.dataset.artist, cover:this.dataset.cover})">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <span>播放</span>
        </button>
        <button class="hx-fav w-9 h-9 rounded-full flex items-center justify-center text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors"
                hx-post="/hx/fav/toggle" hx-target="this" hx-swap="outerHTML"
                hx-vals='{"bvid":"{{.BVID}}","title":"{{.Title}}","artist":"{{.Artist}}","cover":"{{coverURL .Cover}}","duration":"{{.DurationSec}}"}'
                title="收藏">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-4.6-9.5-9C.8 8.6 2.3 5 5.5 5 8 5 12 8 12 8s4-3 6.5-3c3.2 0 4.7 3.6 3 7-2.5 4.4-9.5 9-9.5 9z"/></svg>
        </button>
        <button class="hx-next w-9 h-9 rounded-full hidden sm:flex items-center justify-center text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors"
                data-bvid="{{.BVID}}" data-title="{{.Title}}" data-artist="{{.Artist}}" data-cover="{{coverURL .Cover}}"
                onclick="hcBus.emit('play-next', {bvid:this.dataset.bvid, title:this.dataset.title, artist:this.dataset.artist, cover:this.dataset.cover})" title="下一首播放（插队）">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6v12l8-6z"/><path d="M12 6v12l8-6z" opacity="0.4"/></svg>
        </button>
      </div>
    </div>
    {{end}}
  </div>

  {{if .HasMore}}
  <div class="flex justify-center pt-6">
    <button class="px-6 py-2 rounded-full text-sm font-medium border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors"
            hx-get="/hx/search?kw={{.Keyword}}&page={{.NextPage}}"
            hx-target="#results" hx-swap="innerHTML">加载更多</button>
  </div>
  {{end}}
</div>
{{end}}
