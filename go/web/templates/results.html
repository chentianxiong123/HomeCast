{{/* 搜索结果片段（照抄 Vue 版 SearchView 卡片结构） */}}
{{if not .Items}}
<div class="text-center py-20 text-gray-500 dark:text-gray-400">
  <svg class="w-16 h-16 mx-auto mb-4 text-gray-300 dark:text-gray-600" viewBox="0 0 24 24" fill="currentColor"><path d="M9 18V6H7v12h2zm8-12v12h2V6h-2z"/></svg>
  <p class="text-lg font-medium">未找到相关音乐</p>
  <p class="text-sm">换个关键词试试</p>
</div>
{{else}}
<div class="space-y-6">
  <div class="flex items-center justify-between">
    <h2 class="text-lg font-semibold text-gray-900 dark:text-white">搜索结果</h2>
    <div class="flex items-center space-x-3">
      <button onclick="hcBus.emit('play-all-list', {items: (function(){var a=[];document.querySelectorAll('#results .hx-play[data-bvid]').forEach(function(b){a.push({bvid:b.dataset.bvid,title:b.dataset.title,fullTitle:b.dataset.fullTitle,artist:b.dataset.artist,cover:b.dataset.cover});});return a;})()})"
              class="flex items-center space-x-1 px-4 py-1.5 rounded-full bg-gradient-to-r from-pink-500 to-violet-500 text-white text-sm font-medium shadow-sm hover:brightness-105 transition-all">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <span class="hidden sm:inline">播放全部</span>
      </button>
      <span class="text-sm text-gray-500 dark:text-gray-400">已找到 {{.Total}} 首</span>
    </div>
  </div>

  <div class="grid gap-3">
    {{range .Items}}
    <div class="group flex items-center space-x-3 sm:space-x-4 p-3 sm:p-4 bg-white dark:bg-gray-800 rounded-2xl min-w-0 shadow-sm hover:shadow-md transition-all duration-200 border border-gray-100 dark:border-gray-700" data-ctx-bvid="{{.BVID}}" data-ctx-title="{{shortTitle .Title}}" data-ctx-full-title="{{.Title}}" data-ctx-artist="{{.Artist}}" data-ctx-cover="{{coverURL .Cover}}" data-ctx-duration="{{.DurationSec}}">
      <!-- 封面 + hover 播放 -->
      <div class="relative flex-shrink-0">
        <img src="{{coverURL .Cover}}" alt="{{.Title}}" loading="lazy" referrerpolicy="no-referrer"
             class="w-16 h-12 sm:w-20 sm:h-14 object-cover rounded-xl shadow-sm">
        <button class="hx-play absolute inset-0 bg-black/30 rounded-xl opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center cursor-pointer"
                data-bvid="{{.BVID}}" data-title="{{shortTitle .Title}}" data-full-title="{{.Title}}" data-artist="{{.Artist}}" data-cover="{{coverURL .Cover}}"
                onclick="hcBus.emit('play', {bvid:this.dataset.bvid, title:this.dataset.title, fullTitle:this.dataset.fullTitle, artist:this.dataset.artist, cover:this.dataset.cover})" title="播放">
          <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
      </div>

      <!-- 信息 -->
      <div class="flex-1 min-w-0">
        <h3 class="hx-title text-base sm:text-lg font-semibold text-gray-900 dark:text-white truncate cursor-pointer hover:text-pink-400 transition-colors"
            data-short="{{shortTitle .Title}}" data-full="{{.Title}}" title="点击展开/收起完整标题">{{shortTitle .Title}}</h3>
        <div class="flex items-center space-x-3 mt-1 text-sm text-gray-500 dark:text-gray-400">
          <span class="truncate max-w-[120px]">{{.Artist}}</span>
          <span>{{.Duration}}</span>
        </div>
      </div>

      <!-- 操作按钮（照抄 Vue 版） -->
      <div class="flex items-center space-x-2 flex-shrink-0">
        <button class="hx-play flex items-center space-x-1 px-4 py-1.5 rounded-full bg-gradient-to-r from-pink-500 to-violet-500 text-white text-sm font-medium shadow-sm hover:brightness-105 transition-all"
                data-bvid="{{.BVID}}" data-title="{{shortTitle .Title}}" data-full-title="{{.Title}}" data-artist="{{.Artist}}" data-cover="{{coverURL .Cover}}"
                onclick="hcBus.emit('play', {bvid:this.dataset.bvid, title:this.dataset.title, fullTitle:this.dataset.fullTitle, artist:this.dataset.artist, cover:this.dataset.cover})">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <span>播放</span>
        </button>
        <button class="hx-fav w-9 h-9 rounded-full flex items-center justify-center text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors"
                hx-post="/hx/fav/toggle?bvid={{.BVID}}&title={{.Title | urlquery}}&artist={{.Artist | urlquery}}&cover={{coverURL .Cover | urlquery}}&duration={{.DurationSec}}" hx-target="this" hx-swap="outerHTML"
                hx-on::after-request="hcBus.emit('toast', {msg: this.classList.contains('text-pink-500') ? '已收藏 ♥' : '已取消收藏'})"
                hx-vals='{"bvid":"{{.BVID}}","title":"{{.Title}}","artist":"{{.Artist}}","cover":"{{coverURL .Cover}}","duration":"{{.DurationSec}}"}'
                title="收藏">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-4.6-9.5-9C.8 8.6 2.3 5 5.5 5 8 5 12 8 12 8s4-3 6.5-3c3.2 0 4.7 3.6 3 7-2.5 4.4-9.5 9-9.5 9z"/></svg>
        </button>
        <button class="ctx-more w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0 text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors"
                onclick="this.dispatchEvent(new MouseEvent('contextmenu', {bubbles:true, clientX:event.clientX, clientY:event.clientY}))" title="更多操作">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>
        </button>
        <button class="hx-next w-9 h-9 rounded-full hidden sm:flex items-center justify-center text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors"
                data-bvid="{{.BVID}}" data-title="{{.Title}}" data-artist="{{.Artist}}" data-cover="{{coverURL .Cover}}"
                onclick="hcBus.emit('play-next', {bvid:this.dataset.bvid, title:this.dataset.title, artist:this.dataset.artist, cover:this.dataset.cover})" title="下一首播放（插队）">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6v12l8-6z"/><path d="M12 6v12l8-6z" opacity="0.4"/></svg>
        </button>
      </div>
    </div>
    {{end}}
  </div>

</div>
{{end}}
