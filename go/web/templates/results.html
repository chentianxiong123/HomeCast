{{/* 搜索结果片段：htmx 替换 #results */}}
{{if not .Items}}
<div class="card shadow-sm">
  <div class="card-body items-center py-12 muted">
    <div class="text-5xl mb-3">🎵</div>
    <p class="text-lg">未找到相关音乐</p>
    <p class="text-sm">换个关键词试试</p>
  </div>
</div>
{{else}}
<div class="flex items-center justify-between mb-3 px-1">
  <h2 class="text-lg font-bold">搜索结果</h2>
  <span class="badge badge-outline">共 {{.Total}} 首 · 第 {{.Page}} 页</span>
</div>
<div class="space-y-2">
  {{range .Items}}
  <div class="song-card card shadow-sm hover:shadow-md">
    <div class="card-body p-3 flex-row items-center gap-3">
      <img src="{{coverURL .Cover}}" alt="{{.Title}}" loading="lazy" class="w-20 h-14" referrerpolicy="no-referrer">
      <div class="flex-1 min-w-0">
        <div class="font-medium truncate">{{.Title}}</div>
        <div class="text-sm muted flex items-center gap-2 mt-0.5">
          <span class="truncate max-w-[180px]">{{.Artist}}</span>
          <span class="badge">{{.Duration}}</span>
        </div>
      </div>
      <div class="flex items-center gap-1">
        <button class="btn btn-circle btn-sm btn-primary hx-play" data-bvid="{{.BVID}}" title="播放">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="btn btn-circle btn-sm btn-ghost hx-fav" data-bvid="{{.BVID}}" title="收藏">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 21s-7-4.6-9.5-9C.8 8.6 2.3 5 5.5 5 8 5 12 8 12 8s4-3 6.5-3c3.2 0 4.7 3.6 3 7-2.5 4.4-9.5 9-9.5 9z"/></svg>
        </button>
        <button class="btn btn-circle btn-sm btn-ghost hx-addpl" data-bvid="{{.BVID}}" title="加入列表">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    </div>
  </div>
  {{end}}
</div>
{{if .HasMore}}
<div class="flex justify-center mt-4">
  <button class="btn btn-outline btn-sm"
          hx-get="/hx/search?kw={{.Keyword}}&page={{.NextPage}}"
          hx-target="#results" hx-swap="innerHTML">加载更多</button>
</div>
{{end}}
{{end}}
