<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>哔哩音乐</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body class="min-h-screen bg-gradient-to-br from-gray-50 to-gray-100 dark:from-gray-900 dark:to-gray-800">
  <!-- 顶部导航（对照 Vue 版 navItems：音乐/搜索/收藏夹/投屏） -->
  <header class="bg-white/80 dark:bg-gray-800/80 backdrop-blur-md shadow-sm sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <a href="/hx/music" hx-boost="true" class="flex items-center space-x-2">
          <div class="w-10 h-10 bg-gradient-to-br from-pink-500 to-violet-500 rounded-xl flex items-center justify-center shadow-lg">
            <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="currentColor"><path d="M9 18V6H7v12h2zm8-12v12h2V6h-2z"/></svg>
          </div>
          <h1 class="text-xl font-bold bg-gradient-to-r from-pink-500 to-violet-500 bg-clip-text text-transparent hidden sm:block">哔哩音乐</h1>
        </a>
        <nav class="hidden md:flex space-x-2">
          <a href="/hx/music"  hx-boost="true" class="nav-tab flex items-center space-x-1 px-4 py-2 rounded-full text-base font-medium transition-all duration-200 {{if eq .Active "music"}}bg-gradient-to-r from-pink-500 to-violet-500 text-white shadow-md{{else}}text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700{{end}}">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V6H7v12h2zm8-12v12h2V6h-2z"/></svg><span>音乐</span>
          </a>
          <a href="/hx/search" hx-boost="true" class="nav-tab flex items-center space-x-1 px-4 py-2 rounded-full text-base font-medium transition-all duration-200 {{if eq .Active "search"}}bg-gradient-to-r from-pink-500 to-violet-500 text-white shadow-md{{else}}text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700{{end}}">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><span>搜索</span>
          </a>
          <a href="/hx/favs"   hx-boost="true" class="nav-tab flex items-center space-x-1 px-4 py-2 rounded-full text-base font-medium transition-all duration-200 {{if eq .Active "favs"}}bg-gradient-to-r from-pink-500 to-violet-500 text-white shadow-md{{else}}text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700{{end}}">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-4.6-9.5-9C.8 8.6 2.3 5 5.5 5 8 5 12 8 12 8s4-3 6.5-3c3.2 0 4.7 3.6 3 7-2.5 4.4-9.5 9-9.5 9z"/></svg><span>收藏夹</span>
          </a>
          <a href="/hx/cast"   hx-boost="true" class="nav-tab flex items-center space-x-1 px-4 py-2 rounded-full text-base font-medium transition-all duration-200 {{if eq .Active "cast"}}bg-gradient-to-r from-pink-500 to-violet-500 text-white shadow-md{{else}}text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700{{end}}">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 0 0-10 10h2a8 8 0 0 1 8-8z"/><path d="M12 6a6 6 0 0 0-6 6h2a4 4 0 0 1 4-4z"/><rect x="2" y="16" width="20" height="4" rx="1"/></svg><span>投屏</span>
          </a>
        </nav>
      </div>
    </div>
  </header>

  <!-- 主内容区：各页 content 模板注入 -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 pb-48 md:pb-36">
    {{.Content}}
  </main>

  <!-- 播放器控制栏（M1） -->
  <div id="player-dock">
    <audio id="audio" preload="auto"></audio>
  </div>

  <script src="/assets/htmx.min.js"></script>
</body>
</html>
