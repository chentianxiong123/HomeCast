<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>myMusic</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="icon" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/assets/style.css">
  <script defer src="/assets/alpine.min.js"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-gray-900 to-gray-800">
  <!-- 顶部导航（对照 Vue 版 navItems：音乐/搜索/收藏夹/投屏；高亮由 nav.js 按 URL 推导） -->
    <header class="bg-white/95 dark:bg-gray-800/95 backdrop-blur-lg border-b border-gray-200 dark:border-gray-700 shadow-sm sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8">
      <!-- 桌面（≥768px）：品牌小图标 + 导航整行（顶层专用导航，不藏） -->
      <div class="hidden md:flex items-center gap-4 h-16">
        <a href="/hx/search" hx-get="/hx/search" hx-select="#main" hx-target="#main" hx-swap="innerHTML" hx-push-url="true"
           class="flex items-center flex-shrink-0" title="myMusic">
          <div class="w-8 h-8 bg-gradient-to-br from-pink-500 to-violet-500 rounded-lg flex items-center justify-center shadow">
            <svg class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="currentColor"><path d="M9 18V6H7v12h2zm8-12v12h2V6h-2z"/></svg>
          </div>
        </a>
        <nav class="flex-1 flex items-center space-x-2">
          <a href="/hx/queue"  hx-get="/hx/queue"  hx-select="#main" hx-target="#main" hx-swap="innerHTML" hx-push-url="true"
             class="nav-tab flex items-center space-x-1 px-4 py-2 rounded-full text-base font-medium transition-all duration-200 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V6H7v12h2zm8-12v12h2V6h-2z"/></svg><span>队列</span>
          </a>
          <a href="/hx/search" hx-get="/hx/search" hx-select="#main" hx-target="#main" hx-swap="innerHTML" hx-push-url="true"
             class="nav-tab flex items-center space-x-1 px-4 py-2 rounded-full text-base font-medium transition-all duration-200 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><span>搜索</span>
          </a>
          <a href="/hx/favs"   hx-get="/hx/favs"   hx-select="#main" hx-target="#main" hx-swap="innerHTML" hx-push-url="true"
             class="nav-tab flex items-center space-x-1 px-4 py-2 rounded-full text-base font-medium transition-all duration-200 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-4.6-9.5-9C.8 8.6 2.3 5 5.5 5 8 5 12 8 12 8s4-3 6.5-3c3.2 0 4.7 3.6 3 7-2.5 4.4-9.5 9-9.5 9z"/></svg><span>收藏夹</span>
          </a>
          <a href="/hx/cast"   hx-get="/hx/cast"   hx-select="#main" hx-target="#main" hx-swap="innerHTML" hx-push-url="true"
             class="nav-tab flex items-center space-x-1 px-4 py-2 rounded-full text-base font-medium transition-all duration-200 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 0 0-10 10h2a8 8 0 0 1 8-8z"/><path d="M12 6a6 6 0 0 0-6 6h2a4 4 0 0 1 4-4z"/><rect x="2" y="16" width="20" height="4" rx="1"/></svg><span>投屏</span>
          </a>
          <a href="/hx/settings" hx-get="/hx/settings" hx-select="#main" hx-target="#main" hx-swap="innerHTML" hx-push-url="true"
             class="nav-tab flex items-center space-x-1 px-4 py-2 rounded-full text-base font-medium transition-all duration-200 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>设置</span>
          </a>
        </nav>
      </div>
      <!-- 移动端（<768px）：顶部搜索框整行（不用先进搜索页） -->
      <div class="md:hidden flex items-center h-14 justify-center">
        <form hx-get="/hx/search" hx-target="#main" hx-swap="innerHTML" hx-push-url="true"
              class="flex items-center gap-2 bg-gray-100 dark:bg-gray-700/70 rounded-full px-3.5 h-9 w-full max-w-md">
          <svg class="w-4 h-4 text-gray-400 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="search" name="kw" placeholder="搜索音乐" enterkeyhint="search"
                 class="flex-1 min-w-0 bg-transparent text-sm text-gray-700 dark:text-gray-200 placeholder-gray-400 outline-none"
                 hx-get="/hx/search" hx-target="#main" hx-swap="innerHTML" hx-push-url="true"
                 hx-trigger="input changed delay:600ms" hx-params="kw">
        </form>
      </div>
    </div>
  </header>

  <!-- 移动端底部导航栏（<768px；python 时代同款：阈值以下导航转到下面） -->
  <nav class="md:hidden fixed bottom-0 inset-x-0 z-40 bg-white/95 dark:bg-gray-800/95 backdrop-blur-lg border-t border-gray-200 dark:border-gray-700 shadow-2xl">
    <div class="flex items-stretch h-14">
      <a href="/hx/queue"  hx-get="/hx/queue"  hx-select="#main" hx-target="#main" hx-swap="innerHTML" hx-push-url="true"
         class="nav-tab flex-1 flex flex-col items-center justify-center gap-0.5 mx-1 my-1 rounded-xl transition-colors text-gray-500 dark:text-gray-400">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V6H7v12h2zm8-12v12h2V6h-2z"/></svg><span class="text-[10px] leading-none">队列</span>
      </a>
      <a href="/hx/search" hx-get="/hx/search" hx-select="#main" hx-target="#main" hx-swap="innerHTML" hx-push-url="true"
         class="nav-tab flex-1 flex flex-col items-center justify-center gap-0.5 mx-1 my-1 rounded-xl transition-colors text-gray-500 dark:text-gray-400">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><span class="text-[10px] leading-none">搜索</span>
      </a>
      <a href="/hx/favs"   hx-get="/hx/favs"   hx-select="#main" hx-target="#main" hx-swap="innerHTML" hx-push-url="true"
         class="nav-tab flex-1 flex flex-col items-center justify-center gap-0.5 mx-1 my-1 rounded-xl transition-colors text-gray-500 dark:text-gray-400">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-4.6-9.5-9C.8 8.6 2.3 5 5.5 5 8 5 12 8 12 8s4-3 6.5-3c3.2 0 4.7 3.6 3 7-2.5 4.4-9.5 9-9.5 9z"/></svg><span class="text-[10px] leading-none">收藏夹</span>
      </a>
      <a href="/hx/cast"   hx-get="/hx/cast"   hx-select="#main" hx-target="#main" hx-swap="innerHTML" hx-push-url="true"
         class="nav-tab flex-1 flex flex-col items-center justify-center gap-0.5 mx-1 my-1 rounded-xl transition-colors text-gray-500 dark:text-gray-400">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 0 0-10 10h2a8 8 0 0 1 8-8z"/><path d="M12 6a6 6 0 0 0-6 6h2a4 4 0 0 1 4-4z"/><rect x="2" y="16" width="20" height="4" rx="1"/></svg><span class="text-[10px] leading-none">投屏</span>
      </a>
      <a href="/hx/settings" hx-get="/hx/settings" hx-select="#main" hx-target="#main" hx-swap="innerHTML" hx-push-url="true"
         class="nav-tab flex-1 flex flex-col items-center justify-center gap-0.5 mx-1 my-1 rounded-xl transition-colors text-gray-500 dark:text-gray-400">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span class="text-[10px] leading-none">设置</span>
      </a>
    </div>
  </nav>

  <!-- 主内容区：页面切换只换 #main（hx-select），保 player-dock 与 audio 不中断 -->
  <main id="main" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 pb-60 md:pb-44">
    {{.Content}}
  </main>

  <!-- 播放器控制栏（孤岛 player.js 管辖；照抄 Vue 版 PlayerBar 结构） -->
  <!-- 网页字幕条（多态：网页版显示；桌面版由 GTK 挂件承担，壳注入 hcEnv 默认关） -->
  <!-- 竖向歌词面板：覆盖除 player-dock 外的整个画面（dock z-50 保持可见） -->
      <div id="lyric-panel" class="ly-panel ly-hidden fixed inset-0 z-40">
    <!-- 歌词背景模式：封面模糊（默认）/ 纯色（设置页切换） -->
    <div id="ly-bg-cover" class="absolute inset-0 bg-cover bg-center blur-2xl scale-110 opacity-45"></div>
    <div id="ly-bg-solid" class="absolute inset-0 bg-gray-950"></div>
    <div class="absolute inset-0 bg-gray-950/55"></div>
    <div class="h-full max-w-6xl mx-auto px-4 sm:px-6 py-6 sm:py-8 flex gap-3 sm:gap-4">
      <!-- 左：歌词候选栏（music.py 候选窗同款：自动搜当前歌名，点选即换源） -->
      <div class="w-48 sm:w-64 flex-shrink-0 flex flex-col rounded-2xl bg-gray-900/70 backdrop-blur-md border border-gray-800 overflow-hidden">
        <p class="text-xs text-gray-400 px-3 py-2 border-b border-gray-800 flex-shrink-0 truncate">
          <span class="text-pink-400 font-medium">歌词候选</span> <span id="ly-cand-title" class="text-gray-300"></span>
        </p>
        <div id="ly-cand-list" class="flex-1 overflow-y-auto p-1.5 space-y-1">
          <div class="flex items-center justify-center h-full"><p class="text-xs text-gray-500">搜索中…</p></div>
        </div>
      </div>
      <!-- 中：歌曲信息 + 歌词列表 + 进度条 -->
      <div class="flex-1 min-w-0 flex flex-col">
        <div class="relative mb-6">
          <div class="flex items-center justify-center space-x-4 text-center">
            <img id="ly-cover" src="" alt="" class="w-14 h-14 sm:w-16 sm:h-16 rounded-2xl object-cover shadow-lg flex-shrink-0" referrerpolicy="no-referrer">
            <div class="text-left min-w-0">
              <p id="ly-title" class="text-lg font-bold text-white truncate"></p>
              <p id="ly-artist" class="text-sm text-gray-400 truncate mt-0.5"></p>
              <p id="ly-source" class="text-xs text-gray-500 truncate mt-0.5"></p>
            </div>
          </div>
          <button id="ly-close" title="关闭" class="absolute top-0 right-0 w-9 h-9 rounded-full bg-gray-800 text-gray-300 hover:bg-gray-700 flex items-center justify-center transition-colors">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <!-- 竖向 KTV 歌词列表（实底、撑满中部） -->
        <div id="ly-lines" class="flex-1 overflow-y-auto rounded-xl bg-gray-900/70 backdrop-blur-md border border-gray-800 px-2"></div>
        <!-- 底部进度条（可拖 + 当前/总时长） -->
        <div class="mt-4 flex items-center space-x-3">
          <span id="ly-cur" class="text-xs text-gray-400 font-mono tabular-nums flex-shrink-0">0:00</span>
          <input id="ly-progress" type="range" min="0" max="1000" step="1" value="0"
                 class="flex-1 w-full h-1.5 accent-pink-500 cursor-pointer">
          <span id="ly-dur" class="text-xs text-gray-400 font-mono tabular-nums flex-shrink-0">0:00</span>
        </div>
      </div>
      <!-- 右：工具列（字号 +- / 调音 +-0.5 / 歌曲操作） -->
      <div class="w-12 sm:w-14 flex-shrink-0 flex flex-col items-center gap-2 pt-1">
        <div class="flex flex-col items-center gap-2 p-1.5 rounded-2xl bg-gray-900/70 backdrop-blur-md border border-gray-800">
          <button id="ly-big" title="字号增大" class="w-8 h-8 rounded-full bg-gray-800 text-gray-300 hover:bg-gray-700 flex items-center justify-center transition-colors">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5v14"/></svg>
          </button>
          <span id="ly-size" class="w-11 text-center text-xs text-gray-400 font-mono">3/5</span>
          <button id="ly-small" title="字号减小" class="w-8 h-8 rounded-full bg-gray-800 text-gray-300 hover:bg-gray-700 flex items-center justify-center transition-colors">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg>
          </button>
        </div>
        <div class="flex flex-col items-center gap-2 p-1.5 rounded-2xl bg-gray-900/70 backdrop-blur-md border border-gray-800">
          <button id="ly-pitch-up" title="调音 +0.5（变速不变调）" class="w-8 h-8 rounded-full bg-gray-800 text-gray-300 hover:bg-gray-700 flex items-center justify-center transition-colors">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5v14"/></svg>
          </button>
          <span id="ly-pitch-val" class="text-[10px] text-gray-400 font-mono">1.0x</span>
          <button id="ly-pitch-down" title="调音 -0.5（变速不变调）" class="w-8 h-8 rounded-full bg-gray-800 text-gray-300 hover:bg-gray-700 flex items-center justify-center transition-colors">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg>
          </button>
        </div>
        <div class="flex flex-col items-center gap-2 p-1.5 rounded-2xl bg-gray-900/70 backdrop-blur-md border border-gray-800">
          <button id="ly-fav" title="收藏/取消收藏" class="w-8 h-8 rounded-full bg-gray-800 text-gray-300 hover:bg-gray-700 flex items-center justify-center transition-colors">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7-4.6-9.5-9C.8 8.6 2.3 5 5.5 5 8 5 12 8 12 8s4-3 6.5-3c3.2 0 4.7 3.6 3 7-2.5 4.4-9.5 9-9.5 9z"/></svg>
          </button>
          <button id="ly-bili" title="打开 B 站原视频" class="w-8 h-8 rounded-full bg-gray-800 text-gray-300 hover:bg-gray-700 flex items-center justify-center transition-colors">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zM10.3 8.5l1.7 2.5 1.7-2.5 1.1.8-2.1 3.1v2.6h-1.4v-2.6l-2.1-3.1 1.1-.8z"/></svg>
          </button>
          <button id="ly-copy" title="复制链接" class="w-8 h-8 rounded-full bg-gray-800 text-gray-300 hover:bg-gray-700 flex items-center justify-center transition-colors">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 8h12v12H8zM16 8V4H4v12h4"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 横向歌词字幕：桌面挂件网页版——透明、可拖动（deco 拖动）、可调字号（JS）、悬停浮现控制 -->
  <div id="subtitle-bar" hidden
       class="fixed z-40 group w-max max-w-[85vw] flex items-center gap-2 cursor-grab active:cursor-grabbing select-none">
    <span id="subtitle-text"
          class="text-white/95 font-medium text-center whitespace-nowrap overflow-hidden text-ellipsis"></span>
    <span class="opacity-0 group-hover:opacity-100 transition-opacity duration-200 flex items-center space-x-1">
      <span class="w-7 h-7 rounded-full bg-black/40 text-white/70 flex items-center justify-center cursor-grab" title="拖动字幕条">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M8 7h2v2H8zM14 7h2v2h-2zM8 11h2v2H8zM14 11h2v2h-2zM8 15h2v2H8zM14 15h2v2h-2z"/></svg>
      </span>
      <button id="subtitle-x" title="关闭字幕"
              class="w-7 h-7 rounded-full bg-black/40 text-white/80 hover:text-white hover:bg-black/60 flex items-center justify-center transition-colors">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </span>
    <!-- 卡拉OK横向进度：极淡细线 -->
    <div class="absolute left-1/2 -translate-x-1/2 -bottom-[7px] w-3/4 h-[2px] bg-white/10 rounded-full overflow-hidden group-hover:bg-white/25 transition-colors">
      <div id="subtitle-prog" class="h-full w-0 rounded-full bg-pink-400/80 transition-[width] duration-200 ease-linear"></div>
    </div>
  </div>

  <div id="player-dock" class="hidden fixed left-0 right-0 bg-white/95 dark:bg-gray-800/95 backdrop-blur-lg border-t border-gray-200 dark:border-gray-700 shadow-2xl z-50">
    <audio id="audio" preload="auto"></audio>

    <!-- 进度条 -->
    <div class="w-full px-3 sm:px-4 pt-2">
      <div class="flex items-center space-x-3 text-xs text-gray-500 dark:text-gray-400 mb-1">
        <span id="d-cur" class="w-12 text-right font-mono">0:00</span>
        <input id="d-progress" type="range" min="0" max="1000" step="1" value="0"
               class="flex-1 h-1.5 accent-pink-500 cursor-pointer">
        <span id="d-dur" class="w-12 font-mono">0:00</span>
      </div>
    </div>

    <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-2.5 sm:py-3">
      <div class="flex items-center justify-between gap-2 sm:gap-4 flex-wrap">
        <!-- 歌曲信息 -->
        <div class="flex items-center space-x-3 sm:space-x-4 flex-1 min-w-0">
          <div class="relative flex-shrink-0 group">
            <img id="d-cover" src="" alt=""
                 class="w-12 h-12 sm:w-14 sm:h-14 object-cover rounded-xl shadow-md transition-transform duration-300 group-hover:scale-105 group-hover:shadow-lg group-hover:shadow-pink-500/20" referrerpolicy="no-referrer">
            <!-- 播放频谱（播放中跳动，纯 CSS 动画） -->
            <div id="d-eq" class="absolute inset-x-0 bottom-0 h-6 flex items-end justify-center gap-[2px] px-1 bg-black/30 rounded-b-xl" style="display:none">
              <span class="eq-bar w-[3px] rounded-full bg-pink-400"></span>
              <span class="eq-bar w-[3px] rounded-full bg-pink-400"></span>
              <span class="eq-bar w-[3px] rounded-full bg-pink-400"></span>
              <span class="eq-bar w-[3px] rounded-full bg-pink-400"></span>
              <span class="eq-bar w-[3px] rounded-full bg-pink-400"></span>
            </div>
            <!-- 悬浮提示（参考 YPM Cover hover：遮罩+提示） -->
            <div class="absolute inset-0 rounded-xl bg-black/45 opacity-0 group-hover:opacity-100 transition-opacity duration-200 flex items-center justify-center pointer-events-none">
              <span class="text-[10px] text-white font-medium bg-black/60 rounded-full px-2 py-0.5">歌词</span>
            </div>
          </div>
          <div class="min-w-0">
            <p id="d-title" class="text-base font-semibold text-gray-900 dark:text-white truncate"></p>
            <p id="d-artist" class="text-sm text-gray-500 dark:text-gray-400 truncate"></p>
          </div>
        </div>

        <!-- 控制按钮 -->
        <div class="flex items-center space-x-2 sm:space-x-4">
          <button id="d-tick" title="字幕开关（横向歌词字幕条）" class="w-9 h-9 rounded-full flex items-center justify-center text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 10h10M7 13.5h6"/></svg>
          </button>
          <button id="d-prev" title="上一首" disabled
                  class="flex w-11 h-11 rounded-full items-center justify-center text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
            <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
          </button>
          <button id="d-toggle" title="播放/暂停"
                  class="w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-gradient-to-r from-pink-500 to-violet-500 text-white shadow-lg hover:brightness-105 transition-all flex items-center justify-center flex-shrink-0">
            <svg class="w-7 h-7 ml-0.5" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button id="d-next" title="下一首" disabled
                  class="flex w-11 h-11 rounded-full items-center justify-center text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
            <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
          </button>
        </div>

        <!-- 音量（<640px 收起） -->
        <div class="dock-tools flex items-center space-x-2">
          <button id="d-quality" title="音质（点击切换 64/128/192k）"
                  class="h-8 px-2.5 rounded-lg text-xs font-medium text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">192k</button>
          <button id="d-speed" title="播放速度（点击切换）"
                  class="h-8 px-2.5 rounded-lg text-xs font-medium text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">1.0x</button>
          <button id="d-mode" title="播放模式"
                  class="w-9 h-9 rounded-full flex items-center justify-center text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <button id="d-mute" title="静音"
                  class="w-9 h-9 rounded-full flex items-center justify-center text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/></svg>
          </button>
          <input id="d-vol" type="range" min="0" max="100" value="80"
                 class="w-24 h-1.5 accent-pink-500 cursor-pointer" title="音量">
        </div>
      </div>
    </div>
  </div>
